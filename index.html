<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Escolar</title>
    <!-- Ícone da aba do navegador -->
    <link rel="icon" type="image/png" href="IconeEscolar.png">
    <!-- Link para o arquivo CSS externo -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Cabeçalho / Menu de Navegação -->
    <header>
        <div class="logo-container">
            <img src="IconeEscolar.png" alt="Logo Escola" class="logo-img">
            <span class="school-name">Portal Escolar</span>
        </div>
        <nav>
            <ul>
                <li><a href="#home">Início</a></li>
                <li><a href="#sobre">Sobre</a></li>
                <li><a href="#contato">Contato</a></li>
            </ul>
        </nav>
    </header>

    <!-- Conteúdo Principal com o Botão Central -->
    <main class="hero-section">
        <div class="content-wrapper">
            <h1>Bem-vindo ao Portal de Estudos</h1>
            <p>Acesse rapidamente as nossas plataformas externas clicando abaixo.</p>
            
            <!-- Botão Grande centralizado que leva ao href "Sites" -->
            <a href="Sites" class="main-btn" id="btn-sites">Sites</a>
        </div>
    </main>

    <!-- Rodapé -->
    <footer>
        <p>&copy; 2026 Portal Escolar. Todos os direitos reservados.</p>
    </footer>

    <!-- Link para o arquivo JavaScript externo -->
    <script src="script.js"></script>
</body>
</html>
