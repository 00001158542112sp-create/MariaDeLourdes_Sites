<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sites da Marina</title>
    <!-- Ícone da aba do navegador -->
    <link rel="icon" type="image/png" href="IconeEscolar.png">
    <!-- Link para o arquivo CSS externo -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Cabeçalho / Menu de Navegação -->
    <header>
        <div class="logo-container">
            <img src="IconeEscolar.png" alt="Logo Escola" class="logo-img">
            <span class="school-name">Sites da Escola!</span>
        </div>
        <nav>
            <ul>
                <li><a href="#home">Início</a></li>
                <li><a href="#sobre">Sobre</a></li>
            </ul>
        </nav>
    </header>

    <!-- Conteúdo Principal com o Botão Central -->
    <main class="hero-section">
        <div class="content-wrapper">
            <h1>Bem-vindo ao sites da Maria de Lourdes!</h1>
            <p>Clique abaixo para acessar os nossos sites, jogos educativos e tutoriais!</p>
            
            <!-- Botão Grande centralizado que leva ao href "Sites" -->
            <a href="Sites" class="main-btn" id="btn-sites">Sites</a>
        </div>
    </main>

    <!-- Rodapé -->
    <footer>
        <p id="nntem">só não tem GTA VI</p>
    </footer>

    <!-- Link para o arquivo JavaScript externo -->
    <script src="script.js"></script>
</body>
</html>
